project_id = "strzelnica-rezerwacja"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:5174"
additional_redirect_urls = ["http://localhost:5173", "http://localhost:5174"]
jwt_expiry = 3600
enable_signup = false

[auth.email]
enable_signup = false
enable_confirmations = false

[edge_runtime]
enabled = true

[edge_runtime.secrets]
WIDGET_ORIGIN = "http://localhost:5173"
# Nadawca poczty. Konfiguracja platformy, nie danych Strzelnicy: adres musi
# stać w domenie zweryfikowanej u dostawcy, a tę mamy jedną dla wszystkich.
MAIL_FROM = "Strzelnica <rezerwacje@localhost>"
# RESEND_API_KEY celowo nie stoi tutaj i nie ma go w repozytorium. Bez niego
# Edge Function nie ma czym wysyłać, więc zapisuje wiadomość do `mail_outbox` —
# i to jest przechwytywanie wysyłki, którego wymaga spec dla środowiska
# testowego. Na produkcji: `supabase secrets set RESEND_API_KEY=...`.
