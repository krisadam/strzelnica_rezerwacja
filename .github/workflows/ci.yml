name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Lint i kontrola typów
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

  unit:
    name: Testy jednostkowe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  database:
    name: Migracje, seed i typy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Wersja przypięta: `latest` pyta API GitHuba o wydania i zwraca 403,
      # kiedy limit zapytań runnera jest wyczerpany.
      - uses: supabase/setup-cli@v1
        id: supabase-cli
        with:
          version: 2.55.0
      - run: pnpm install --frozen-lockfile
      # `db reset` odtwarza bazę od zera z migracji i wykonuje seed.
      # Padnie, gdy migracja lub seed są niespójne.
      - run: supabase start
      - run: supabase db reset
      # Typy w repozytorium mają być generowane ze schematu, a nie pisane
      # ręcznie. Regeneracja, która cokolwiek zmienia, oznacza rozjazd.
      - run: pnpm db:types
      - name: Typy odpowiadają schematowi
        run: git diff --exit-code -- packages/shared/src/database.types.ts
      - if: always() && steps.supabase-cli.outcome == 'success'
        run: supabase stop --no-backup

  browser:
    name: Testy przeglądarkowe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: supabase/setup-cli@v1
        id: supabase-cli
        with:
          version: 2.55.0
      - run: pnpm install --frozen-lockfile
      # Testy przeglądarkowe jadą przeciwko lokalnemu Supabase (spec: „Szew
      # pomocniczy: przeglądarka, lokalny Supabase w Dockerze"). Grafik bierze
      # się z seeda, a nagłówek `frame-ancestors` — z listy domen Strzelnicy.
      - run: supabase start
      - run: supabase db reset
      - run: pnpm db:env
      - run: pnpm --filter @strzelnica/e2e exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
      - if: always() && steps.supabase-cli.outcome == 'success'
        run: supabase stop --no-backup
